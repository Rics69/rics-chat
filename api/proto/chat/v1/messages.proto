syntax = "proto3";

package chat.v1;

import "chat/v1/user.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Rics69/rics-chat/pkg/api/chat/v1;chatv1";

service MessagesService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse) {
    option (google.api.http) = {
      post: "/api/v1/messages"
      body: "*"
    };
  }

  // История диалога от новых к старым
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option (google.api.http) = {get: "/api/v1/dialogs/{peer_id}/messages"};
  }

  // Собеседники с последним сообщением, сначала самые свежие
  rpc ListDialogs(ListDialogsRequest) returns (ListDialogsResponse) {
    option (google.api.http) = {get: "/api/v1/dialogs"};
  }
}

message Message {
  int64 id = 1;
  int64 sender_id = 2;
  int64 recipient_id = 3;
  string text = 4;
  google.protobuf.Timestamp created_at = 5;
}

message Dialog {
  User peer = 1;
  Message last_message = 2;
}

message SendMessageRequest {
  int64 recipient_id = 1;
  string text = 2;
}

message SendMessageResponse {
  Message message = 1;
}

message ListMessagesRequest {
  int64 peer_id = 1;
  optional int64 before_id = 2;
  int32 limit = 3;
}

message ListMessagesResponse {
  repeated Message messages = 1;
  // не задан, если старше сообщений нет
  optional int64 next_before_id = 2;
}

message ListDialogsRequest {
  int32 limit = 1;
}

message ListDialogsResponse {
  repeated Dialog dialogs = 1;
}

services:
  rics-chat:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/chat/Dockerfile
    container_name: rics-chat
    environment:
      - POSTGRES_HOST=rics-chat-postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_TTL=${JWT_TTL}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - TIME_ZONE=${TIME_ZONE}
      - LOGGER_FOLDER=/app/out/logs
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    ports:
      - "8080:8080"
    depends_on:
      - rics-chat-postgres
    restart: always

  rics-chat-postgres:
    image: postgres:18.6-bookworm
    container_name: rics-chat-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  rics-chat-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: rics-chat-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:rics-chat-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
  buf:
    image: bufbuild/buf:1.73.0
    working_dir: /workspace
    environment:
      - BUF_CACHE_DIR=/workspace/out/buf-cache
    volumes:
      - ${PROJECT_ROOT}:/workspace
